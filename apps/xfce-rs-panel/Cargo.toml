[package]
name = "xfce-rs-panel"
version = "0.1.0"
edition = "2021"
authors = ["XFCE.rs Contributors"]
description = "Lightweight Wayland panel for XFCE.rs"
license = "GPL-2.0-or-later"
repository = "https://github.com/ohsalmeron/xfce-rs"
keywords = ["xfce", "panel", "wayland"]
categories = ["gui"]

[[bin]]
name = "xfce-rs-panel"
path = "src/main.rs"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.10", features = ["client"] }
calloop = "0.14"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
memfd = "0.6"
libc = "0.2"
serde = { workspace = true, features = ["derive"] }
config = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
